<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedido recebido</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1><span th:text="${nome}">Visitante</span>, o seu <span th:text="${nomePedido}">pedido</span> foi recebido com sucesso!</h1>
<p>Preço total: <span th:text="${precoPedido}">preço</span></p>
<p>Tipo: <span th:text="${categoria}">tipo</span></p>
</body>
</html>
